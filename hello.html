<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鹈鹕骑车</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f8ff;
            margin: 0;
        }
        svg {
            width: 80%;
            max-width: 600px;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 60%, #90EE90 60%, #228B22 100%);
        }
        
        /* 简单的动画效果 */
        .wheel {
            transform-origin: center;
            animation: spin 1s linear infinite;
        }
        
        .legs {
            transform-origin: 250px 280px; /* 髋关节位置 */
            animation: pedal 1s linear infinite;
        }

        .arm-left {
            transform-origin: 260px 240px;
            animation: steer 1s linear infinite;
        }

        .cloud {
            animation: float 10s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        @keyframes pedal {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes steer {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        @keyframes float {
            0% { transform: translateX(0px); }
            50% { transform: translateX(20px); }
            100% { transform: translateX(0px); }
        }
    </style>
</head>
<body>

<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
    <!-- 背景装饰：云 -->
    <g class="cloud" opacity="0.8">
        <circle cx="100" cy="80" r="30" fill="white"/>
        <circle cx="130" cy="70" r="40" fill="white"/>
        <circle cx="160" cy="80" r="30" fill="white"/>
    </g>
    <g class="cloud" style="animation-delay: -5s; opacity: 0.6; transform: scale(0.8);">
        <circle cx="350" cy="60" r="20" fill="white"/>
        <circle cx="370" cy="50" r="30" fill="white"/>
        <circle cx="390" cy="60" r="20" fill="white"/>
    </g>

    <!-- 自行车 -->
    <g transform="translate(0, 20)">
        <!-- 后轮 -->
        <g class="wheel" transform-origin="120 300">
            <circle cx="120" cy="300" r="40" fill="none" stroke="#333" stroke-width="6"/>
            <circle cx="120" cy="300" r="35" fill="none" stroke="#ddd" stroke-width="2"/>
            <line x1="120" y1="300" x2="120" y2="260" stroke="#999" stroke-width="2"/>
            <line x1="120" y1="300" x2="160" y2="300" stroke="#999" stroke-width="2"/>
            <line x1="120" y1="300" x2="120" y2="340" stroke="#999" stroke-width="2"/>
            <line x1="120" y1="300" x2="80" y2="300" stroke="#999" stroke-width="2"/>
        </g>

        <!-- 前轮 -->
        <g class="wheel" transform-origin="320 300">
            <circle cx="320" cy="300" r="40" fill="none" stroke="#333" stroke-width="6"/>
            <circle cx="320" cy="300" r="35" fill="none" stroke="#ddd" stroke-width="2"/>
            <line x1="320" y1="300" x2="320" y2="260" stroke="#999" stroke-width="2"/>
            <line x1="320" y1="300" x2="360" y2="300" stroke="#999" stroke-width="2"/>
            <line x1="320" y1="300" x2="320" y2="340" stroke="#999" stroke-width="2"/>
            <line x1="320" y1="300" x2="280" y2="300" stroke="#999" stroke-width="2"/>
        </g>

        <!-- 车架 -->
        <path d="M120 300 L220 300 L200 220 L120 300 M220 300 L320 300 M200 220 L320 220" fill="none" stroke="#FF6347" stroke-width="8" stroke-linejoin="round"/>
        <path d="M320 220 L320 180" fill="none" stroke="#333" stroke-width="6"/> <!-- 车把立管 -->
        <path d="M320 180 L300 180" fill="none" stroke="#333" stroke-width="6"/> <!-- 车把 -->
        
        <!-- 座位 -->
        <path d="M180 220 L220 220" stroke="#333" stroke-width="10" stroke-linecap="round"/>
    </g>

    <!-- 鹈鹕 -->
    <g transform="translate(0, 20)">
        <!-- 身体 -->
        <ellipse cx="210" cy="230" rx="50" ry="60" fill="#fff" stroke="#eee" stroke-width="2"/>
        <!-- 翅膀 (遮挡身体) -->
        <path d="M210 220 Q260 220 260 260 Q260 300 210 290" fill="#f0f0f0" stroke="#ddd" stroke-width="2"/>

        <!-- 脖子 -->
        <path d="M200 190 Q190 160 210 140" fill="none" stroke="#fff" stroke-width="35" stroke-linecap="round"/>
        
        <!-- 头 -->
        <circle cx="210" cy="130" r="25" fill="#fff"/>
        
        <!-- 眼睛 -->
        <circle cx="220" cy="125" r="4" fill="#000"/>
        <circle cx="222" cy="123" r="1.5" fill="#fff"/>

        <!-- 喙 (大嘴巴) -->
        <path d="M230 120 Q280 120 310 150 Q280 160 230 150 Z" fill="#FFA500"/> <!-- 上喙 -->
        <path d="M230 150 Q280 150 310 150 Q280 180 230 170 Z" fill="#FFD700" opacity="0.8"/> <!-- 喉囊 -->
        <line x1="230" y1="135" x2="310" y2="150" stroke="#cc8400" stroke-width="1"/>

        <!-- 腿和脚 (为了动画，放在单独的组里) -->
        <g class="legs">
            <!-- 左腿 -->
            <path d="M220 260 L220 290 L200 290" fill="none" stroke="#FFA500" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- 右腿 -->
            <path d="M220 260 L220 290 L240 290" fill="none" stroke="#FFA500" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
        </g>

        <!-- 手臂 (翅膀) -->
        <g class="arm-left">
            <path d="M210 200 L280 190 L300 180" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
            <circle cx="300" cy="180" r="6" fill="#FFA500"/> <!-- 手掌/爪子 -->
        </g>
        
        <!-- 另一只手臂 (在身体后面) -->
        <path d="M210 200 L280 210 L300 200" fill="none" stroke="#f0f0f0" stroke-width="12" stroke-linecap="round"/>
        <circle cx="300" cy="200" r="6" fill="#FFA500"/>
<a src="www.baidu.com" text="zhb"/>
    </g>
</svg>

</body>
</html>
